<style>
  :root { color-scheme: light dark; --bg: #f6f4f1; --card: #fff; --ink: #333; --muted: #777; --line: #ccc; --accent: #805494; --err: #c62641; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1c; --ink: #eee; --muted: #aaa; --line: #444; --accent: #b98fcc; --err: #ff6b81; } }

  html, body { height: 100%; margin: 0; }

  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  input, button { width: 100%; font: inherit; font-size: 17px; border-radius: 10px; padding: 12px 14px; }
  input { border: 1px solid var(--line); background: transparent; color: var(--ink); margin-bottom: 12px; }
  button { border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #err { min-height: 1.5em; margin: 10px 0 0; color: var(--err); font-size: 14px; }
  a { color: var(--muted); font-size: 14px; display: inline-block; margin-top: 14px; }
</style>
